server:
  port: 8081

spring:
  application:
    name: aihub-platform-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aihub_platform}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # 规则持久化：限流规则从 Nacos 拉取，dashboard 或 Nacos 控制台改规则不再"重启即丢"。
      # 规则样例见 docs/nacos/。单机模式未启动 Nacos 时仅打 WARN，不阻断启动。
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: aihub-platform-service-flow-rules
            rule-type: flow
            data-type: json
  # 从 Nacos 拉取基础设施配置（改配置无需重启）
  config:
    import:
      - optional:nacos:aihub-common.yaml
      - optional:nacos:aihub-platform-service.yaml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aihub:
  security:
    jwt-secret: ${AIHUB_JWT_SECRET:aihub-default-dev-secret-please-change-me-32bytes}
    jwt-expire-seconds: 7200
    # API Key 的 HMAC 密钥：与 JWT 密钥分离，避免一处泄露牵连另一处
    api-key-secret: ${AIHUB_APIKEY_SECRET:aihub-default-apikey-secret-please-change-me}
    # 单租户可签发的有效 Key 上限
    max-api-keys-per-tenant: 20

management:
  endpoints:
    web:
      exposure:
        # prometheus 供指标抓取（Prometheus + Grafana 可视化）
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 接口文档（springdoc / Swagger UI）：http://127.0.0.1:8081/swagger-ui.html
# 生产不对外暴露时改 enabled=false，并在网关/防火墙限制服务端口直连
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.aihub: info
  # 链路追踪：traceId 由 TraceContext 写入 MDC，日志自动携带（无链路时为 --）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:--}] [%thread] %logger{36} - %msg%n"
