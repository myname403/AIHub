server:
  port: 8080

spring:
  application:
    name: aihub-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: aihub-platform
          uri: lb://aihub-platform-service
          predicates:
            - Path=/auth/**,/api/platform/**
        - id: aihub-ai
          uri: lb://aihub-ai-service
          predicates:
            - Path=/api/ai/**
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      # 规则持久化：网关流控规则（gw-flow，按路由维度限流）从 Nacos 拉取，
      # dashboard 或 Nacos 控制台改规则不再"重启即丢"。规则样例见 docs/nacos/。
      # 单机模式未启动 Nacos 时，规则拉取失败仅打 WARN 日志，不阻断启动。
      datasource:
        gw-flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: ${NACOS_GROUP:DEFAULT_GROUP}
            data-id: aihub-gateway-flow-rules
            rule-type: gw-flow
            data-type: json
      # 网关限流后的兜底响应
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":10006,"message":"请求过于频繁，请稍后再试"}'

  # 从 Nacos 拉取配置（改配置无需重启，即热更新）
  config:
    import:
      - optional:nacos:aihub-common.yaml
      - optional:nacos:aihub-gateway.yaml

aihub:
  security:
    # 生产环境请放入 Nacos 并开启鉴权，不要使用默认值
    jwt-secret: ${AIHUB_JWT_SECRET:aihub-default-dev-secret-please-change-me-32bytes}
  # 开放 API Key 校验（网关回调平台服务）
  apikey:
    verify-url: ${AIHUB_PLATFORM_URL:http://aihub-platform-service}
    # 校验超时：鉴权在主链路上，不能让平台服务拖死网关
    verify-timeout-ms: 2000
    # 校验结果缓存：省掉绝大部分远程调用；设 false 则每次实时校验
    cache-enabled: ${AIHUB_APIKEY_CACHE:true}
    # 缓存 TTL 是「延迟」与「吊销及时性」的平衡点
    cache-ttl-seconds: 60
    cache-max-size: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aihub: info
  # 链路追踪：traceId 由 TraceContext 写入 MDC，日志自动携带（无链路时为 --）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:--}] [%thread] %logger{36} - %msg%n"
