version: "3.8"

# AIHub 本地依赖一键拉起：
#   docker compose up -d
#   docker compose ps        # 全部 healthy 后再启动服务
#
# 版本对齐（严禁混用）：
#   Spring Boot 3.5.x -> Spring Cloud 2025.0.x -> Spring Cloud Alibaba 2025.0.0.0
#   Nacos 3.0.3 / Sentinel 1.8.9

services:

  mysql:
    image: mysql:8.0
    container_name: aihub-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: aihub_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # ★ 必须是 redis-stack：普通 Redis 没有向量检索能力
    image: redis/redis-stack-server:7.4.0-v6
    container_name: aihub-redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      # 断言 search 模块存在，缺模块则向量能力不可用
      test: ["CMD-SHELL", "redis-cli MODULE LIST | grep -q search || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: aihub-nacos
    ports:
      - "8848:8848"   # HTTP / 控制台
      - "9848:9848"   # 客户端 gRPC
      - "9849:9849"   # 服务端 gRPC
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      # Nacos 3.x 必须显式配置鉴权相关变量
      NACOS_AUTH_TOKEN: YWlodWJfZGV2X3Rva2VuX3BsZWFzZV9jaGFuZ2VfbWVfMzJieXRlcw==
      NACOS_AUTH_IDENTITY_KEY: aihub
      NACOS_AUTH_IDENTITY_VALUE: aihub
      NACOS_AUTH_ENABLE: "true"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/index.html >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  sentinel:
    # 控制台版本与客户端 1.8.9 解耦；如拉取不到请改用其它可用 tag
    image: bladex/sentinel-dashboard:1.8.6
    container_name: aihub-sentinel
    ports:
      - "8858:8858"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8858 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    # 可选：aihub.storage.type=minio 时才需要（入库原始文件多实例共享）。
    # 用 latest 保证可得；生产请固定到具体 RELEASE tag
    image: minio/minio:latest
    container_name: aihub-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台（浏览器打开，账号见 MINIO_ROOT_USER）
    environment:
      MINIO_ROOT_USER: aihub
      MINIO_ROOT_PASSWORD: aihub12345
      TZ: Asia/Shanghai
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  minio-data:
