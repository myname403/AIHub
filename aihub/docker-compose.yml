version: "3.8"

# AIHub 本地依赖一键拉起：
#   docker compose up -d
#   docker compose ps        # 全部 healthy 后再启动服务
#
# 版本对齐（严禁混用）：
#   Spring Boot 3.5.x -> Spring Cloud 2025.0.x -> Spring Cloud Alibaba 2025.0.0.0
#   Nacos 3.0.3 / Sentinel 1.8.9

services:

  mysql:
    image: mysql:8.0
    container_name: aihub-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: aihub_platform
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # ★ 必须是 redis-stack：普通 Redis 没有向量检索能力
    image: redis/redis-stack-server:7.4.0-v6
    container_name: aihub-redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      # 断言 search 模块存在，缺模块则向量能力不可用
      test: ["CMD-SHELL", "redis-cli MODULE LIST | grep -q search || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: aihub-nacos
    ports:
      - "8848:8848"   # HTTP / 控制台
      - "9848:9848"   # 客户端 gRPC
      - "9849:9849"   # 服务端 gRPC
    environment:
      MODE: standalone
      TZ: Asia/Shanghai
      # Nacos 3.x 必须显式配置鉴权相关变量
      NACOS_AUTH_TOKEN: YWlodWJfZGV2X3Rva2VuX3BsZWFzZV9jaGFuZ2VfbWVfMzJieXRlcw==
      NACOS_AUTH_IDENTITY_KEY: aihub
      NACOS_AUTH_IDENTITY_VALUE: aihub
      # 注意：开启鉴权后必须先初始化管理员用户，否则客户端登录 403：
      #   docker exec aihub-nacos curl -s -X POST 'http://127.0.0.1:8848/nacos/v3/auth/user/admin' -d 'password=Nacos@aihub123'
      # （仅管理员不存在时可调用一次；凭据需与 aihub-common.yml 的 spring.cloud.nacos 账号一致）
      NACOS_AUTH_ENABLE: "true"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8848/index.html >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  sentinel:
    # 使用国内镜像代理，解决bladex原镜像拉取不到的问题
    image: docker.1ms.run/bladex/sentinel-dashboard:1.8.6
    container_name: aihub-sentinel
    ports:
      - "8858:8858"
    environment:
      TZ: Asia/Shanghai
      # 增加登录账号密码，旧镜像默认账号sentinel / sentinel
      AUTH_USERNAME: sentinel
      AUTH_PASSWORD: sentinel
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8858 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: always


  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aihub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Java 服务跑宿主机，Prometheus 用 host.docker.internal 抓取（Linux 也生效）
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aihub-grafana
    ports:
      - "3000:3000"
    environment:
      # 登录凭据（本地开发默认值，生产务必修改）
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  minio-data:
  prometheus-data:
  grafana-data:
